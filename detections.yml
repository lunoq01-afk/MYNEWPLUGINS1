# =====================================================================
#  GoldRushAC - detections.yml
#  One entry per detection. Every detection has:
#    enabled      turn the detection on/off
#    threshold    the violation level shown as "x/threshold" in alerts
#    decay        seconds for 1.0 violation level to fade (0 = never fades)
#    alert        send staff alerts for this detection
#    debug        stream debug lines to staff who run /ac debug <player>
#    min-flags    how many separate flags are needed before any punishment step can fire
#    punishment   escalation steps. action = ALERT | LOG | WARN | KICK | TEMPBAN | BAN
#                 KICK / TEMPBAN / BAN / WARN only run when punishments.auto-punish is true in
#                 config.yml (off by default); otherwise they create a staff review request.
#  Reload with /ac reload.
# =====================================================================

detections:
