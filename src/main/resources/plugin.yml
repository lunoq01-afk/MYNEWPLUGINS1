name: GoldRushAC
version: 1.0.0
main: dev.goldrush.anticheat.GoldRushAC
api-version: '1.21'
author: GoldRush
description: Staff-focused anti-cheat monitoring for GoldRush.
commands:
  ac:
    description: GoldRushAC staff controls
    usage: /ac <alerts|debug|reload|info>
    permission: goldrushac.staff
  sus:
    description: View a player's anti-cheat status
    usage: /sus <player>
    permission: goldrushac.sus
  alerts:
    description: Toggle anti-cheat alerts
    usage: /alerts
    permission: goldrushac.alerts
permissions:
  goldrushac.staff:
    default: op
  goldrushac.sus:
    default: op
  goldrushac.alerts:
    default: op
  goldrushac.bypass:
    default: false
  goldrushac.reload:
    default: op
